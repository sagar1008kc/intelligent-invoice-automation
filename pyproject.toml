[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-invoice-automation"
version = "1.0.0"
description = "Multi-agent invoice processing system for Acme Corp (Galatiq case)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-xai>=0.2.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "pdfplumber>=0.11.0",
  "rich>=13.7.0",
  "streamlit>=1.36.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-mock>=3.14.0"]

[project.scripts]
acme-invoice = "acme_invoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
